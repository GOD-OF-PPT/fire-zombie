<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1021" />
    <title>PRISM SWARM: Neon Protocol V2《棱镜蜂群：霓虹协议》</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #0d1b3d, #040712 75%);
        color: #e6ffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app-shell {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: calc(100dvh * 9 / 16);
        background-color: #0b1021;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(62, 243, 255, 0.18);
        overflow: hidden;
        touch-action: none;
      }
      @media (max-aspect-ratio: 9/16) {
        #app {
          max-width: 100%;
          box-shadow: none;
        }
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
:root {
  --cyan: #3ef3ff;
  --green: #19f5a8;
  --red: #ff3b5c;
  --gold: #ffc531;
  --violet: #b98cff;
  --panel: rgba(7, 12, 32, 0.94);
  --font: 'Arial Black', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}

.ui {
  font-family: var(--font);
  color: #eaffff;
  overflow: hidden;
  container-type: size;
}
.ui * { box-sizing: border-box; }

button {
  font-family: var(--font);
  cursor: pointer;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

/* ------------------------------------------------------------ generic screens */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.28s ease, visibility 0s linear 0.28s;
  pointer-events: none;
}
.screen.show {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.28s ease;
  pointer-events: auto;
}
.modal { background: rgba(2, 5, 16, 0.68); backdrop-filter: blur(6px); z-index: 30; }
.panel {
  width: min(90%, 430px);
  background: linear-gradient(165deg, rgba(16, 28, 62, 0.96), rgba(6, 10, 26, 0.97));
  border: 1.5px solid rgba(62, 243, 255, 0.52);
  border-radius: 22px;
  padding: 20px 18px 18px;
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.65), 0 0 36px rgba(62, 243, 255, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  transform: translateY(16px) scale(0.96);
  transition: transform 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
  max-height: 92%;
  overflow-y: auto;
}
.screen.show .panel { transform: none; }
.panel h2 { margin: 0 0 4px; text-align: center; font-size: 25px; letter-spacing: 2px; }

.big-btn, .mid-btn {
  border-radius: 15px;
  color: #04111a;
  font-size: 21px;
  padding: 13px 16px;
  background: linear-gradient(180deg, #9cfbff, #15bede);
  box-shadow: 0 5px 0 #096880, 0 0 24px rgba(62, 243, 255, 0.42);
  letter-spacing: 2px;
  transition: transform 0.08s, filter 0.15s;
}
.big-btn:hover, .mid-btn:hover { filter: brightness(1.06); }
.big-btn:active, .mid-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #096880; }
.mid-btn { font-size: 15px; padding: 10px 11px; letter-spacing: 1px; background: linear-gradient(180deg, #ffe48a, #ffb21a); box-shadow: 0 4px 0 #a26a00; }
.mid-btn.ghost { background: rgba(255, 255, 255, 0.08); color: #cfe9ff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.22); }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(6, 13, 34, 0.78);
  color: #eaffff;
  font-size: 16px;
  box-shadow: inset 0 0 0 1.5px rgba(62, 243, 255, 0.45), 0 4px 12px rgba(0, 0, 0, 0.35);
  pointer-events: auto;
  flex: none;
}
.icon-btn.off { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); opacity: 0.72; }
.speed-btn { font-size: 14px; font-weight: 900; color: #bfefff; }
.speed-btn.fast {
  color: #140b00;
  background: linear-gradient(180deg, #fff07a, #ffae19);
  box-shadow: 0 0 14px rgba(255, 197, 49, 0.75);
}

/* ------------------------------------------------------------ title */
.title-screen {
  background:
    linear-gradient(118deg, transparent 0 44%, rgba(62, 243, 255, 0.035) 44% 45.5%, transparent 45.5%),
    radial-gradient(ellipse at 50% 30%, rgba(16, 44, 108, 0.28), rgba(3, 6, 18, 0.86) 74%);
  justify-content: space-between;
  gap: 6px;
  padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  z-index: 20;
}
.title-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.title-ver {
  font: 800 10px/1 system-ui, sans-serif;
  letter-spacing: 3px;
  color: #8be9ff;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(8, 22, 48, 0.72);
  box-shadow: inset 0 0 0 1px rgba(62, 243, 255, 0.32);
}
.logo { text-align: center; margin-top: -1.5vh; flex: none; }
.logo h1 {
  margin: 5px 0 0;
  font-size: clamp(36px, 12.5cqw, 62px);
  letter-spacing: 6px;
  background: linear-gradient(180deg, #ffffff 12%, #8ffaff 55%, #2a8dff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 18px rgba(62, 243, 255, 0.58)) drop-shadow(0 4px 0 #0b2a66);
  animation: logoIn 0.8s cubic-bezier(0.2, 1.5, 0.4, 1);
}
.logo-en { font-size: 14px; letter-spacing: 9px; color: var(--gold); margin-top: 2px; text-shadow: 0 0 12px rgba(255, 197, 49, 0.7); }
.tagline { margin-top: 5px; font-size: 11.5px; color: #b5d2ff; letter-spacing: 1px; font-family: system-ui, sans-serif; font-weight: 700; }
.logo-prism { display: flex; justify-content: center; gap: 6px; height: 34px; }
.logo-prism span {
  width: 18px; height: 30px;
  background: linear-gradient(180deg, #fff, var(--cyan));
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  filter: drop-shadow(0 0 8px var(--cyan));
  animation: bob 1.6s ease-in-out infinite;
}
.logo-prism span:nth-child(2) { height: 34px; width: 22px; background: linear-gradient(180deg, #fff, var(--gold)); animation-delay: -0.4s; }
.logo-prism span:nth-child(3) { animation-delay: -0.8s; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes logoIn { from { transform: scale(0.6); opacity: 0; } }

.sector-list { width: min(100%, 420px); display: flex; flex-direction: column; gap: 8px; }
.sector-card {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px;
  border-radius: 15px;
  background: linear-gradient(105deg, rgba(11, 20, 48, 0.92), rgba(7, 12, 30, 0.92));
  color: #e6ffff;
  text-align: left;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.1), 0 4px 14px rgba(0, 0, 0, 0.28);
  transition: transform 0.15s, box-shadow 0.15s;
}
.sector-card.sel { box-shadow: inset 0 0 0 2.5px var(--cyan), 0 0 22px rgba(62, 243, 255, 0.35); transform: scale(1.015); }
.sector-card.s2.sel { box-shadow: inset 0 0 0 2.5px #ff4fd8, 0 0 22px rgba(255, 79, 216, 0.35); }
.sector-card.s3.sel { box-shadow: inset 0 0 0 2.5px var(--gold), 0 0 22px rgba(255, 197, 49, 0.35); }
.sector-card.s4.sel { box-shadow: inset 0 0 0 2.5px #7dff9a, 0 0 22px rgba(125, 255, 154, 0.35); }
.sector-card.locked { cursor: not-allowed; color: #9aabc5; background: rgba(6, 10, 26, 0.86); }
.sector-card.locked .sc-num, .sector-card.locked .sc-body, .sector-card.locked .sc-stars { opacity: 0.46; }
.sc-num { font-size: 25px; color: var(--cyan); width: 38px; }
.s2 .sc-num { color: #ff4fd8; }
.s3 .sc-num { color: var(--gold); }
.s4 .sc-num { color: #7dff9a; }
.sc-body { flex: 1; min-width: 0; }
.sc-name { font-size: 17px; display: flex; align-items: baseline; gap: 6px; }
.sc-hi { font: 700 11px/1 system-ui, sans-serif; color: #8be9ff; opacity: 0.85; }
.sc-boss { font-size: 11.5px; color: #9fb6d8; font-family: system-ui, sans-serif; font-weight: 700; margin-top: 2px; }
.sc-stars span { color: rgba(255, 255, 255, 0.18); font-size: 18px; }
.sc-stars span.on { color: var(--gold); text-shadow: 0 0 8px rgba(255, 197, 49, 0.85); }
.start-btn { width: min(100%, 420px); font-size: 26px; padding: 14px; animation: pulseBtn 1.5s ease-in-out infinite; }
@keyframes pulseBtn { 50% { box-shadow: 0 5px 0 #096880, 0 0 38px rgba(62, 243, 255, 0.78); } }
.title-foot { font-size: 10.5px; color: #849cc0; font-family: system-ui, sans-serif; font-weight: 700; text-align: center; }

.endless-card {
  width: min(100%, 420px); min-height: 54px; flex: none;
  display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  border: 0; border-radius: 14px; text-align: left; color: #eef2ff;
  background: linear-gradient(105deg, rgba(34, 16, 72, 0.95), rgba(8, 25, 54, 0.95));
  box-shadow: inset 0 0 0 1.5px rgba(194, 155, 255, 0.65), inset 3px 0 0 #c29bff, 0 5px 20px rgba(0, 0, 0, 0.25);
}
.endless-card:not(.locked):hover { box-shadow: inset 0 0 0 2px #c29bff, inset 3px 0 0 #fff, 0 0 22px rgba(194, 155, 255, 0.32); }
.endless-card.locked { cursor: not-allowed; filter: saturate(0.55); background: rgba(8, 12, 30, 0.9); }
.endless-card.locked > span { opacity: 0.55; }
.endless-icon { width: 36px; font-size: 36px; line-height: 1; color: #c29bff; text-align: center; text-shadow: 0 0 14px rgba(194, 155, 255, 0.65); }
.endless-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.endless-body b { font-size: 16px; letter-spacing: 2px; }
.endless-body small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b9c9e8; font: 700 11px/1.35 system-ui, sans-serif; }
.endless-go { flex: none; color: #e2d2ff; font-size: 13px; }

.endless-hud {
  display: none; position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 98px); right: 10px;
  align-items: center; gap: 8px; white-space: nowrap;
  padding: 4px 11px; border-radius: 10px; color: #e6d9ff;
  background: linear-gradient(90deg, rgba(24, 11, 48, 0.85), rgba(7, 20, 44, 0.85));
  box-shadow: inset 0 0 0 1px rgba(194, 155, 255, 0.48); text-shadow: 0 1px 3px #000;
  font: 700 11px/1.25 system-ui, sans-serif;
}
.endless-hud b { color: #fff; font-size: 12.5px; letter-spacing: 1px; }
.hud.endless .endless-hud { display: flex; }
.hud.endless .progress-fill { background: linear-gradient(90deg, #704dff, #c29bff, #3ef3ff); }
.r-endless-wave { color: #c29bff; }
.r-endless-wave b { color: #e6d9ff; font-size: 18px; }

/* Protocol Draft & Synergies */
.protocol-screen { background: rgba(2, 7, 19, 0.85); backdrop-filter: blur(9px); z-index: 45; }
.protocol-panel { width: min(92%, 440px); border: 1.5px solid #688bba77; border-radius: 18px; padding: 20px 18px; background: linear-gradient(145deg, #14233d, #080e20 75%); gap: 10px; box-shadow: 0 24px 90px #000b, inset 0 1px #d6eaff22; }
.protocol-kicker { text-align: center; color: #83e5cf; font: 700 10px/1.3 system-ui, sans-serif; letter-spacing: 4px; }
.protocol-panel h2 { font-size: 26px; margin: 0; letter-spacing: 3px; }
.protocol-lead { margin: 0 0 2px; color: #9ab0d0; font: 12px/1.6 system-ui, sans-serif; text-align: center; }
.protocol-choices { display: flex; flex-direction: column; gap: 8px; }
.protocol-choice { position: relative; display: flex; align-items: center; gap: 13px; padding: 13px 12px; min-height: 90px; color: #e9f1ff; text-align: left; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--pc) 32%, transparent); background: linear-gradient(105deg, color-mix(in srgb, var(--pc) 10%, #10192b), #0b1426); transition: border-color .15s, transform .15s, background .15s; }
.protocol-choice:hover, .protocol-choice:focus-visible { outline: none; border-color: var(--pc); transform: translateX(3px); background: color-mix(in srgb, var(--pc) 17%, #10192b); box-shadow: inset 3px 0 var(--pc); }
.protocol-glyph { width: 42px; height: 48px; flex: none; display: grid; place-items: center; font-size: 32px; color: var(--pc); background: color-mix(in srgb, var(--pc) 8%, transparent); border: 1px solid color-mix(in srgb, var(--pc) 24%, transparent); clip-path: polygon(12% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 12%); }
.protocol-copy { display: flex; flex-direction: column; gap: 3px; padding-right: 10px; }
.protocol-copy small { color: var(--pc); font: 700 10px/1.3 system-ui, sans-serif; letter-spacing: 1px; }
.protocol-copy b { font-size: 17px; letter-spacing: 2px; }
.protocol-copy > span { color: #b2c3dc; font: 12px/1.55 system-ui, sans-serif; }
.syn-unlock { font: 800 11px/1.3 system-ui, sans-serif; color: #ffe46b; margin-top: 2px; }
.protocol-choice > i { position: absolute; right: 10px; top: 10px; font: 700 11px/1 system-ui, sans-serif; color: #7e92ae; }
.protocol-synergies { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.protocol-synergies span {
  font: 800 11px/1.2 system-ui, sans-serif;
  padding: 4px 9px;
  border-radius: 999px;
  color: var(--sc);
  background: color-mix(in srgb, var(--sc) 14%, rgba(0, 0, 0, 0.5));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sc) 55%, transparent);
}
.protocol-next { display: grid; gap: 4px; padding: 10px 0 2px; border-top: 1px solid #bdceee19; }
.protocol-next > span { color: #8299b7; font: 10px/1.4 system-ui, sans-serif; letter-spacing: 2px; }
.protocol-next b { color: #e5c99e; font-size: 15px; }
.protocol-next small, .protocol-installed, .protocol-note { color: #8296b2; font: 11px/1.55 system-ui, sans-serif; }
.protocol-note { font-size: 10px; text-align: center; color: #637b9b; }

/* help */
.help-panel h2 { color: var(--cyan); }
.help-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: #d6e6ff; }
.help-list li { display: flex; gap: 10px; align-items: flex-start; }
.help-list b { color: #fff; }
.help-list b.neg { color: var(--red); }
.hi { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 15px; background: rgba(255, 255, 255, 0.08); }
.hi.move { color: var(--cyan); } .hi.pos { color: var(--green); } .hi.gold { color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.hi.vault { color: var(--violet); } .hi.barrel { color: #ff9a3c; } .hi.lens { color: var(--gold); } .hi.reso { color: #fff36b; } .hi.boss { color: var(--red); }

/* ------------------------------------------------------------ HUD */
.hud { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.hud.show { opacity: 1; }
.hud-top {
  position: absolute; left: 0; right: 0; top: 0;
  padding: max(10px, env(safe-area-inset-top)) 10px 0;
  display: flex; align-items: center; gap: 8px;
  pointer-events: none;
}
.progress { flex: 1; position: relative; height: 18px; transition: opacity 0.3s; }
.progress.hide { opacity: 0; }
.progress-track { position: absolute; inset: 4px 22px 4px 0; border-radius: 6px; background: rgba(0, 0, 0, 0.58); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1f6dff, var(--cyan)); box-shadow: 0 0 10px var(--cyan); }
.hud[data-sector='2'] .progress-fill { background: linear-gradient(90deg, #9b4dff, #ff4fd8); }
.hud[data-sector='3'] .progress-fill { background: linear-gradient(90deg, #ff3355, var(--gold)); }
.progress-boss { position: absolute; right: 0; top: -4px; font-size: 20px; color: var(--red); text-shadow: 0 0 8px var(--red); }

.boss-bar { position: absolute; left: 56px; right: 98px; top: max(8px, env(safe-area-inset-top)); opacity: 0; transform: translateY(-20px); transition: all 0.4s; }
.boss-bar.show { opacity: 1; transform: none; }
.boss-label { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #ffd1da; text-shadow: 0 0 6px #ff2a55; margin-bottom: 3px; }
.boss-phase i { display: inline-block; width: 9px; height: 9px; margin-left: 4px; transform: rotate(45deg); background: rgba(255, 255, 255, 0.2); }
.boss-phase i.on { background: var(--red); box-shadow: 0 0 6px var(--red); }
.boss-track { height: 14px; border-radius: 7px; background: rgba(0, 0, 0, 0.65); box-shadow: inset 0 0 0 2px rgba(255, 59, 92, 0.65); overflow: hidden; }
.boss-fill { height: 100%; background: linear-gradient(90deg, #ff2a55, #ff9a3c); transition: width 0.12s; box-shadow: 0 0 10px #ff2a55; }
.boss-bar.shielded .boss-fill { background: linear-gradient(90deg, #6fd8ff, #c9f6ff); }
.boss-bar.enraged .boss-track { animation: boss-enrage 0.6s ease-in-out infinite alternate; }
.boss-bar.enraged .boss-name { color: #ff6a3c; }
@keyframes boss-enrage { from { box-shadow: inset 0 0 0 2px rgba(255, 59, 92, 0.6); } to { box-shadow: inset 0 0 0 2px #ff6a3c, 0 0 14px #ff2a55; } }

.hud-row { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 48px); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
.chips { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 7px; border-radius: 11px;
  background: rgba(4, 9, 26, 0.78);
  box-shadow: inset 0 0 0 1.5px var(--wc, var(--cyan));
  font-size: 12.5px;
}
.chip .g { font-size: 15px; width: 18px; text-align: center; }
.chip .lv { display: inline-flex; gap: 3px; margin-left: 2px; }
.chip .lv i { width: 7px; height: 11px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); }
.chip .lv i.on { background: var(--wc, var(--cyan)); box-shadow: 0 0 6px var(--wc, var(--cyan)); }
.chip.pop { animation: chipPop 0.5s cubic-bezier(0.2, 1.8, 0.4, 1); }
@keyframes chipPop { from { transform: scale(1.45); } }
.dps-chip {
  --wc: rgba(140, 220, 255, 0.42);
  font: 800 11px/1.2 system-ui, sans-serif;
  color: #bfefff;
  padding: 3px 9px;
}
.blades-chip { --wc: #ffd84a; display: none; color: #ffe9a0; }
.blades-chip.show { display: inline-flex; }

.score-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.score { font-size: 22px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px rgba(62, 243, 255, 0.6); }
.fever-badge {
  display: none;
  padding: 3px 9px;
  border-radius: 999px;
  font: 900 11px/1.2 system-ui, sans-serif;
  color: #1c0b00;
  background: linear-gradient(90deg, #ffe26a, #ff922e);
  box-shadow: 0 0 12px rgba(255, 160, 50, 0.7);
}
.fever-badge.show { display: inline-block; animation: chipPop 0.35s ease-out; }
.fever-badge.max { background: linear-gradient(90deg, #ff5ce0, #ffc531); color: #fff; text-shadow: 0 1px 2px #000; }

.squad-badge {
  position: absolute; left: 0; top: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 3px 12px 3px 9px;
  border-radius: 999px;
  background: rgba(3, 30, 42, 0.88);
  box-shadow: inset 0 0 0 2px var(--cyan), 0 0 14px rgba(62, 243, 255, 0.45);
  font-size: 22px;
  white-space: nowrap;
  will-change: transform;
}
.squad-badge .sq-icon { color: var(--cyan); font-size: 14px; }
.squad-badge.t2 { box-shadow: inset 0 0 0 2px #9ffcff, 0 0 18px rgba(159, 252, 255, 0.6); font-size: 25px; }
.squad-badge.t3 { box-shadow: inset 0 0 0 3px var(--gold), 0 0 24px rgba(255, 197, 49, 0.7); font-size: 28px; }
.squad-badge.t3 .sq-icon { color: var(--gold); }
.squad-badge.up .sq-num { animation: numUp 0.45s ease-out; }
.squad-badge.down .sq-num { animation: numDown 0.45s ease-out; }
