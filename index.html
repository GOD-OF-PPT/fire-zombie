<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1021" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PRISM SWARM: Neon Protocol《棱镜蜂群：霓虹协议》</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050814;
        color: #e6ffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app-shell {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: calc(100dvh * 9 / 16);
        background-color: #0b1021;
        overflow: hidden;
        touch-action: none;
      }
      @media (max-aspect-ratio: 9/16) {
        #app {
          max-width: 100%;
        }
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="app" data-testid="game-stage">
        <canvas id="game-canvas" data-testid="game-canvas"></canvas>
        <div id="ui-root"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
